services:
  weatherstation:
    image: ghcr.io/racoon80/weatherstation:latest
    restart: always
    ports:
      - "3001:3001"
    environment:
      # Set your OpenWeatherMap API key here.
      - OPENWEATHER_API_KEY=your_api_key_here
      - DEFAULT_CITY=Luxembourg
      - DEFAULT_COUNTRY=LU
      - WINDY_API_KEY=your_windy_key_here
      - WINDY_ZOOM=12
      - WINDY_ROTATELAYERS=true
      - WINDY_LAYERSTOROTATE=wind,rain,radar
      - WINDY_DELAYROTATE=5000
      - GOOGLE_CALENDAR_CLIENT_ID=your_client_id_here
      - GOOGLE_CALENDAR_CLIENT_SECRET=your_client_secret_here
      - GOOGLE_CALENDAR_REFRESH_TOKEN=your_refresh_token_here
      - GOOGLE_CALENDAR_ID=your_calendar_id_here
    volumes:
      - /mnt/user/appdata/WeatherStation:/app/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
