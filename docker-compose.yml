services:
  weatherstation:
    image: ghcr.io/racoon80/weatherstation:latest
    # Uncomment to build the local source instead of pulling the published image.
    # build: .
    restart: always
    init: true
    ports:
      # Reachable on every host interface. If only the reverse proxy should
      # reach it and the proxy runs on this host, use "127.0.0.1:3001:3001".
      - "3001:3001"
    environment:
      # Prefer env_file (below) or the key file over inline secrets: values set
      # here are visible in `docker inspect` and easy to commit by accident.
      - OPENWEATHER_API_KEY=your_api_key_here
      - DEFAULT_CITY=Luxembourg
      - DEFAULT_COUNTRY=LU
      - WINDY_API_KEY=your_windy_key_here
      - WINDY_ZOOM=6
      - WINDY_SHOWLAYER=rain
      - ICAL_URL=your_ical_url_here
      - MAXIMUM_ENTRIES=8
    # env_file:
    #   - .env
    volumes:
      # Read-only: the app only ever reads openweather.key from here.
      - /mnt/user/appdata/WeatherStation:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
