<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherStation Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">WeatherStation</p>
          <h1>Settings</h1>
          <p class="subhead">
            Store your OpenWeatherMap API key in this browser for use by the
            dashboard.
          </p>
          <a class="settings-link" href="index.html">Back to dashboard</a>
        </div>
      </header>

      <main class="grid">
        <section class="card position-card">
          <h2>API key</h2>
          <form id="settingsForm" class="location-form">
            <label>
              OpenWeatherMap API key
              <input
                type="password"
                name="apiKey"
                placeholder="Paste your key"
                autocomplete="off"
                required
              />
            </label>
            <label>
              Language
              <select name="lang">
                <option value="en">English</option>
                <option value="fr">Francais</option>
                <option value="de">Deutsch</option>
              </select>
            </label>
            <button type="submit">Save key</button>
            <p id="settingsStatus" class="subhead"></p>
          </form>
        </section>
      </main>
    </div>

    <script src="settings.js"></script>
  </body>
</html>
